<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#090D16">
    <title>{% block title %}SmartEcoAI{% endblock %}</title>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('home.home') }}" aria-label="SmartEcoAI home">
            <span class="brand-dot" aria-hidden="true"></span>
            <span class="brand-wordmark">SmartEcoAI</span>
        </a>
        <nav class="nav-links" aria-label="Primary">
            <a class="{% if request.endpoint == 'home.home' %}active{% endif %}" href="{{ url_for('home.home') }}" {% if request.endpoint == 'home.home' %}aria-current="page"{% endif %}>Home</a>
            <a class="{% if request.endpoint == 'camera.camera' %}active{% endif %}" href="{{ url_for('camera.camera') }}" {% if request.endpoint == 'camera.camera' %}aria-current="page"{% endif %}>Camera</a>
            <a class="{% if request.endpoint == 'dashboard.dashboard' %}active{% endif %}" href="{{ url_for('dashboard.dashboard') }}" {% if request.endpoint == 'dashboard.dashboard' %}aria-current="page"{% endif %}>Dashboard</a>
            <a class="{% if request.endpoint == 'violations.violations' %}active{% endif %}" href="{{ url_for('violations.violations') }}" {% if request.endpoint == 'violations.violations' %}aria-current="page"{% endif %}>Violations</a>
            <a class="{% if request.endpoint == 'reports.reports' %}active{% endif %}" href="{{ url_for('reports.reports') }}" {% if request.endpoint == 'reports.reports' %}aria-current="page"{% endif %}>Reports</a>
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>SmartEcoAI | Sustainable monitoring for cleaner streets.</p>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
