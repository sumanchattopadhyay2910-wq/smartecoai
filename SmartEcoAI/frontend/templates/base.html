<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SmartEcoAI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <span class="brand-mark">●</span>
            <span>SmartEcoAI</span>
        </div>
        <nav class="nav-links">
            <a href="{{ url_for('home.home') }}">Home</a>
            <a href="{{ url_for('camera.camera') }}">Camera</a>
            <a href="{{ url_for('dashboard.dashboard') }}">Dashboard</a>
            <a href="{{ url_for('violations.violations') }}">Violations</a>
            <a href="{{ url_for('reports.reports') }}">Reports</a>
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>SmartEcoAI • Sustainable monitoring for cleaner streets.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
